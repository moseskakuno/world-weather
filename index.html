<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Current weather and 7-day forecasts for 1,000 major cities around the world."
    >

    <title>World Weather</title>

    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <header class="site-header">

        <div class="header-content">

            <p class="eyebrow">
                GLOBAL WEATHER
            </p>

            <h1>
                World Weather
            </h1>

            <p class="subtitle">
                Current conditions and 7-day forecasts
                for major cities around the world.
            </p>

        </div>

    </header>


    <main>

        <section class="dashboard-info">

            <div>
                <strong id="city-count">
                    Loading cities...
                </strong>

                <span>
                    cities
                </span>
            </div>

            <div>
                <strong id="page-info">
                    Loading...
                </strong>
            </div>

        </section>


        <section
            id="weather-container"
            class="weather-container"
            aria-live="polite"
        >
            <div class="loading">
                Loading world weather...
            </div>
        </section>


        <nav
            class="pagination-container"
            aria-label="Weather pagination"
        >

            <ul
                id="pagination"
                class="pagination"
            >
            </ul>

        </nav>

    </main>


    <footer class="site-footer">
    <p>
        Weather data provided by
        <a
            href="https://open-meteo.com/"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open-Meteo
        </a>
    </p>

    <p>
        City data sourced from
        <a
            href="https://github.com/joelacus/world-cities"
            target="_blank"
            rel="noopener noreferrer"
        >
            World Cities / GeoNames
        </a>
        under CC BY 4.0.
    </p>
</footer>


    <script src="script.js"></script>

</body>

</html>
