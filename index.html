<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Current weather and 7-day forecasts for cities around the world."
    >

    <title>World Weather</title>

    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <header class="site-header">

        <div class="header-content">

            <p class="eyebrow">
                GLOBAL WEATHER
            </p>

            <h1>
                World Weather
            </h1>

            <p class="subtitle">
                Current conditions and 7-day forecasts
                for cities around the world.
            </p>

        </div>

    </header>


    <main>

        <!-- DASHBOARD INFORMATION -->

        <section class="dashboard-info">

            <div>
                <strong id="city-count">
                    Loading cities...
                </strong>

                <span>
                    cities
                </span>
            </div>

            <div>
                <strong id="page-info">
                    Loading...
                </strong>
            </div>

        </section>


        <!-- CITY SEARCH -->

        <section class="search-section">

            <div class="search-box">

                <label
                    for="city-search"
                    class="search-label"
                >
                    Search for a city
                </label>

                <div class="search-input-wrapper">

                    <span
                        class="search-icon"
                        aria-hidden="true"
                    >
                        🔍
                    </span>

                    <input
                        type="search"
                        id="city-search"
                        class="city-search"
                        placeholder="Search city..."
                        autocomplete="off"
                        spellcheck="false"
                        aria-label="Search for a city"
                        aria-controls="search-results"
                    >

                    <button
                        type="button"
                        id="clear-search"
                        class="clear-search"
                        aria-label="Clear search"
                        hidden
                    >
                        ×
                    </button>

                </div>


                <!-- SEARCH RESULTS -->

                <div
                    id="search-results"
                    class="search-results"
                    role="listbox"
                    aria-label="City search results"
                >
                </div>

            </div>

        </section>


        <!-- WEATHER CARDS -->

        <section
            id="weather-container"
            class="weather-container"
            aria-live="polite"
        >
            <div class="loading">
                Loading world weather...
            </div>
        </section>


        <!-- PAGINATION -->

        <nav
            class="pagination-container"
            aria-label="Weather pagination"
        >

            <ul
                id="pagination"
                class="pagination"
            >
            </ul>

        </nav>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        <p>
            Weather data provided by
            <a
                href="https://open-meteo.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Open-Meteo
            </a>
        </p>

        <p>
            City data sourced from
            <a
                href="https://github.com/joelacus/world-cities"
                target="_blank"
                rel="noopener noreferrer"
            >
                World Cities / GeoNames
            </a>
            under CC BY 4.0.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
